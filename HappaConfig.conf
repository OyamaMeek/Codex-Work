[MITM]
# HTTPS 解密配置；需系统信任此 CA，并通过 hostname 指定解密主机
# 当前本节没有 hostname 列表，仅配置证书与参数不等于解密所有 HTTPS
# 参考：https://manual.nssurge.com/http/mitm.html
# 解密时跳过远端服务器证书校验；客户端仍会收到 Surge 生成的证书
skip-server-cert-verify = true
# 允许对匹配 hostname 的原始 TCP 连接进行 HTTPS 解密
tcp-connection = true
# 允许使用 HTTP/2 进行 MITM 解密
h2 = true
# 需要 HTTPS 解密时，在 Surge 内生成或导入自己的 CA 证书，并配置 hostname。
# 共享模板不携带 CA 私钥和证书密码。

[Script]
