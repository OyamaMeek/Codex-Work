# 规则模式下自上而下匹配，首条命中决定策略；调整顺序会改变分流结果
# RULE-SET 引用外部规则集合；DOMAIN-SET 引用域名集合；行末是目标策略或策略组
# 参考：https://manual.nssurge.com/rules/overview.html
# 指定 IPv4 网段直接连接；/24 覆盖 23.247.129.0 至 23.247.129.255
IP-CIDR,23.247.129.1/24,DIRECT
# ---逻辑规则---
# > AND规则:当所含规则全部匹配时，会被触发
# 拒绝目标端口为 443 的 UDP 请求（常用于 QUIC / HTTP/3）
# REJECT-NO-DROP 避免常规 REJECT 因频繁命中自动升级为静默丢弃
AND,((PROTOCOL,UDP), (DEST-PORT,443)),REJECT-NO-DROP
